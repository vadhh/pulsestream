version: '3.8'

services:
  # The Nervous System: Redpanda (Kafka compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: pulsestream-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr 127.0.0.1:33145
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 9644:9644
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # The Memory: Redis
  redis:
    image: redis:alpine
    container_name: pulsestream-redis
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

  # The Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulsestream-qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant-data:/qdrant/storage

  # The Brain: Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: pulsestream-ollama
    ports:
      - 11434:11434
    volumes:
      - ollama-data:/root/.ollama
    # For GPU support (Nvidia), uncomment below lines:
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: 1
               capabilities: [gpu]

volumes:
  redpanda-data:
  redis-data:
  qdrant-data:
  ollama-data: